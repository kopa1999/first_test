spring.application.name=order-service

server.port=8085

services.user.url=http://localhost:8081
services.product.url=http://localhost:8082
services.shopping.url=http://localhost:8083
services.payment.url=http://localhost:8084

spring.datasource.url=jdbc:postgresql://localhost:5432/orderdb
spring.datasource.username=product_user
spring.datasource.password=product_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info